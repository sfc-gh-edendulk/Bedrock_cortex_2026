  CortexAnalyzeRevenueResourcePolicy:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt CortexAnalyzeRevenueLambda.Arn
      Principal: bedrock.amazonaws.com
      SourceAccount: !Sub ${AWS::AccountId}
      SourceArn: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*  

  CortexSearchAirbnbResourcePolicy:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt CortexSearchAirbnbListingsLambda.Arn
      Principal: bedrock.amazonaws.com
      SourceAccount: !Sub ${AWS::AccountId}
      SourceArn: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*  

  CortexSearchFOMCResourcePolicy:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt CortexSearchFOMCMeetingsLambda.Arn
      Principal: bedrock.amazonaws.com
      SourceAccount: !Sub ${AWS::AccountId}
      SourceArn: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*                

  AmazonBedrockAgentsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AmazonBedrockAgentsRole
      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: bedrock.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
  
  AgentResource:
    Type: AWS::Bedrock::Agent
    Properties:
      AgentName: !Ref AgentName
      AgentResourceRoleArn: !GetAtt AmazonBedrockAgentsRole.Arn
      AutoPrepare: true
      FoundationModel: "us.amazon.nova-pro-v1:0"
      Instruction: "You are an agent that can handle various tasks. First look at all the tasks below and then decide which task to perform. 
                    1/ answer questions related to revenue, profit, expenses and perfromance of the business of a retail company by using the action group ag-cortex-analyze-revenue. 
                    2/ Helping users do research and finding up-to-date information on airbnb listing and rooms by using action group ag-cortex-search-airbnb-listing. 
                    3/ Helping users answer questions about FOMC_MEETING on Federal Open Market Committee (FOMC), gdp, unemployment, fed's view, market change using action group ag-cortex-search-fomc-meetings."
      IdleSessionTTLInSeconds: 60
      ActionGroups:
        - ActionGroupName: ag-cortex-analyze-revenue
          ActionGroupExecutor:
            Lambda: !GetAtt CortexAnalyzeRevenueLambda.Arn
          FunctionSchema:
            Functions:
              - Name: cortex-analyze-revenue
                Description: cortex-analyze-revenue
        - ActionGroupName: ag-cortex-search-airbnb-listing
          ActionGroupExecutor:
            Lambda: !GetAtt CortexSearchAirbnbListingsLambda.Arn
          FunctionSchema:
            Functions:
              - Name: cortex-search-airbnb-listing
                Description: cortex-search-airbnb-listing
                Parameters:
                  amenities:
                    Description: amenities
                    Required: False
                    Type: string
                  limit:
                    Description: limit
                    Required: False
                    Type: string
                  room_type:
                    Description: room_type
                    Required: False
                    Type: string
                  search_query:
                    Description: search_query
                    Required: True
                    Type: string
        - ActionGroupName: ag-cortex-search-fomc-meetings
          ActionGroupExecutor:
            Lambda: !GetAtt CortexSearchFOMCMeetingsLambda.Arn
          FunctionSchema:
            Functions:
              - Name: cortex-search-fomc-meetings
